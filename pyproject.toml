[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falco"
version = "0.1.0"
description = "Falco: an editor that generates standalone password-based SSH launcher executables."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Falco" }]
# The editor is a pure-stdlib + Tk GUI. SSH/SFTP/keyring now live in the Rust
# launcher (launcher-rs/), so the Python side has no third-party runtime deps.
dependencies = []

[project.optional-dependencies]
# Pillow lets PyInstaller accept a .png icon and convert it to .ico/.icns.
build = ["pyinstaller>=6.3", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
falco-editor = "editor.__main__:main"

[tool.setuptools]
# Flat layout: the top-level directories are the importable packages.
# The launcher is now a Rust crate (launcher-rs/), not a Python package.
packages = ["editor", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
