name: release

# On every push to main, build the Falco Editor for Windows, macOS and Linux
# and publish them together as a new GitHub Release. Each editor bundles all
# three per-OS launcher stubs, so any one of them can emit Windows/macOS/Linux
# launchers from a single run.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  # Build the launcher stub natively on each OS and publish it as a canonically
  # named artifact so the editor jobs can bundle all three.
  build-stubs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            stub: launcher-rs/target/release/falco-stub.exe
            artifact: falco-stub-windows.exe
          - os: macos-latest
            stub: launcher-rs/target/release/falco-stub
            artifact: falco-stub-macos
          - os: ubuntu-latest
            stub: launcher-rs/target/release/falco-stub
            artifact: falco-stub-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The Linux keyring backend talks to the Secret Service over D-Bus.
      - name: Install libdbus (Secret Service keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build launcher stub
        run: cargo build --locked --release --manifest-path launcher-rs/Cargo.toml

      - name: Stage stub under its canonical name
        shell: bash
        run: cp "${{ matrix.stub }}" "${{ matrix.artifact }}"

      - name: Upload stub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build:
    needs: [build-stubs, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: falco-editor-windows.exe
            artifact: dist/falco-editor.exe
          - os: macos-latest
            asset: falco-editor-macos
            artifact: dist/falco-editor
          - os: ubuntu-latest
            asset: falco-editor-linux
            artifact: dist/falco-editor
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bundle every platform's stub so this editor can build all three.
      - name: Download all launcher stubs
        uses: actions/download-artifact@v4
        with:
          path: stubs
          pattern: falco-stub-*
          merge-multiple: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Falco Editor
        run: python build/build_editor.py --name falco-editor --out-dir dist

      - name: Rename artifact for this OS
        shell: bash
        run: cp "${{ matrix.artifact }}" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download editor build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: falco-editor-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Falco Editor (build ${{ github.run_number }})
          body: |
            Standalone Falco Editor built from ${{ github.sha }}.

            Assets:
            - `falco-editor-windows.exe` — Windows
            - `falco-editor-macos` — macOS
            - `falco-editor-linux` — Linux

            Each editor bundles prebuilt Rust launcher stubs for all three
            platforms, so a single editor can emit Windows/macOS/Linux launchers
            with no toolchain — fully offline (see the README).
          files: artifacts/*
          fail_on_unmatched_files: true
