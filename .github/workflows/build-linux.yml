name: build-linux

# Optional Linux binaries (spec marks Linux as nice-to-have for v1).
# Linux keyring support requires a Secret Service backend at runtime.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Launcher name (e.g. meks)"
        required: true
        default: "meks"
      host:
        description: "SSH host or IP"
        required: true
      user:
        description: "SSH username"
        required: true
      port:
        description: "SSH port"
        required: true
        default: "22"
      output:
        description: "Output filename"
        required: true
        default: "meks"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # The Linux keyring backend talks to the Secret Service over D-Bus.
      - name: Install libdbus (Secret Service keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build launcher stub
        run: cargo build --release --manifest-path launcher-rs/Cargo.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build launcher
        run: >
          python build/build_launcher.py
          --name "${{ github.event.inputs.name }}"
          --host "${{ github.event.inputs.host }}"
          --user "${{ github.event.inputs.user }}"
          --port "${{ github.event.inputs.port }}"
          --output "${{ github.event.inputs.output }}"
          --out-dir dist

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.name }}-linux
          path: dist/${{ github.event.inputs.output }}
          if-no-files-found: error
