[package]
name = "falco-stub"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "falco-stub"
path = "src/main.rs"

[lib]
name = "falco_stub"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "net", "time", "signal"] }
russh = "0.45"
russh-sftp = "2"
keyring = "3"
rpassword = "7"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
